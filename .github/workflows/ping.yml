name: Garder le backend eveille

on:
  schedule:
    - cron: "*/5 6-17 * * 0-4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reveiller le backend et la base
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 https://mz-sitehub-backend.onrender.com/health/db
